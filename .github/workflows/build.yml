name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: mc-1.21.1, java: 21, gradle: "8.12" }
          - { dir: mc-26.3,   java: 25, gradle: "current" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "${{ matrix.gradle }}" }
      - run: gradle build
        working-directory: ${{ matrix.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: character-loading-screens-${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/*.jar
